<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#110919"><title>Результаты забега — OpenScaler Day</title><link rel="icon" href="../assets/favicon.svg"><style>
@font-face{font-family:Montserrat;src:url('../assets/fonts/Montserrat-Variable.ttf') format('truetype');font-style:normal;font-weight:100 900;font-display:swap}
:root{font-family:Montserrat,Arial,sans-serif;color:#fbf8ff;background:#110919}*{box-sizing:border-box}body{margin:0}main{min-height:100vh;background:radial-gradient(ellipse at 88% 0%,#7543b6 0%,transparent 40%),radial-gradient(ellipse at 4% 30%,#62214e 0%,transparent 36%),#110919}.shell{max-width:1060px;margin:auto;padding:clamp(30px,6vw,75px) clamp(20px,5vw,55px)}header{margin-bottom:42px}.eyebrow,.kicker{font-size:12px;font-weight:800;letter-spacing:.13em;color:#d1b4ef;margin:0 0 18px}h1{font-size:clamp(44px,7vw,76px);letter-spacing:-.055em;line-height:1.03;margin:0;font-weight:900}h1 span{color:#d2a9ff}.intro{font-size:15px;line-height:1.6;color:#d2c7dc;margin:20px 0 0}.board{border:1px solid #84639b;border-radius:26px;background:rgba(29,15,42,.96);box-shadow:8px 10px 0 rgba(0,0,0,.38);padding:clamp(20px,4vw,36px)}.boardhead{display:flex;justify-content:space-between;align-items:center;gap:20px}.boardhead .kicker{margin-bottom:8px}.boardhead h2{margin:0;font-size:26px;letter-spacing:-.04em}.live{display:inline-flex;align-items:center;gap:8px;color:#d5c9e4;font-size:12px;font-weight:600;white-space:nowrap}.live i{width:8px;height:8px;border-radius:50%;background:#9fe8db;box-shadow:0 0 12px #9fe8db}.summary{font-size:13px;color:#c2b3d0;margin:24px 0 16px}.summary strong{color:white}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left}th{background:#39254c;color:#d8cbe5;font-size:12px;text-transform:uppercase;letter-spacing:.05em}th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0;width:33%}th{padding:15px}td{padding:15px;border-bottom:1px solid #503860;font-size:15px}td:last-child{font-weight:800;color:#f1dcff}.notice{font-size:14px;line-height:1.6;color:#cec2d9;padding:20px 0 8px}footer{margin-top:35px;color:#a28caf;font-size:11px;letter-spacing:.1em;font-weight:700}[hidden]{display:none!important}@media(max-width:500px){.boardhead{align-items:flex-start}.live{font-size:10px}.boardhead h2{font-size:23px}th{font-size:10px}.intro{font-size:14px}}
</style></head><body><main><div class="shell"><header><p class="eyebrow">OPENSCALER DAY</p><h1>Результаты<br><span>забега</span></h1><p class="intro">Лучшие раннеры конференции. Таблица обновляется автоматически.</p></header><section class="board" aria-label="Результаты участников"><div class="boardhead"><div><p class="kicker">ТАБЛИЦА РЕЗУЛЬТАТОВ</p><h2>Участники</h2></div><span class="live"><i></i>Обновляется</span></div><p class="notice" id="notice" role="status">Загружаем результаты…</p><div id="content" hidden><p class="summary">Всего забегов: <strong id="count">0</strong></p><div class="tablewrap"><table><thead><tr><th>Telegram-алиас</th><th>Очки</th></tr></thead><tbody id="scores"></tbody></table></div><p class="notice" id="empty" hidden>Пока нет результатов. Первый появится здесь после забега.</p></div></section><footer>OPENSCALER DAY · БЕГИ, РОБОТ, БЕГИ!</footer></div></main><script>
(()=>{'use strict';const endpoint='https://openscaler-run-results-26.timurfazullin.chatgpt.site/api/scores';const key=location.hash.slice(1);const $=id=>document.getElementById(id);let rows=[],hasData=false;
function draw(){const sorted=[...rows].sort((a,b)=>b.score-a.score||a.alias.localeCompare(b.alias,'ru'));$('scores').replaceChildren();for(const row of sorted){const tr=document.createElement('tr'),alias=document.createElement('td'),score=document.createElement('td');alias.textContent=row.alias;score.textContent=String(row.score);tr.append(alias,score);$('scores').append(tr)}$('count').textContent=String(rows.length);$('empty').hidden=rows.length!==0;}
async function refresh(){if(!/^[a-f0-9]{64}$/.test(key)){$('notice').textContent='Откройте личную ссылку организаторов, чтобы увидеть результаты.';return}try{const response=await fetch(endpoint,{headers:{'x-view-key':key},cache:'no-store'});if(response.status===403){$('notice').hidden=false;$('notice').textContent='Откройте личную ссылку организаторов, чтобы увидеть результаты.';$('content').hidden=true;return}if(!response.ok)throw new Error('unavailable');const data=await response.json();if(!Array.isArray(data.scores))throw new Error('invalid data');rows=data.scores.filter(x=>x&&typeof x.alias==='string'&&Number.isSafeInteger(x.score));hasData=true;$('notice').hidden=true;$('content').hidden=false;draw()}catch{if(!hasData){$('notice').hidden=false;$('notice').textContent='Не удалось загрузить результаты. Проверяем соединение…'}else{$('notice').hidden=false;$('notice').textContent='Не удалось обновить результаты. Проверяем соединение…'}}}refresh();setInterval(refresh,5000)})();
</script></body></html>
