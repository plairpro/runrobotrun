/* Ink-and-paper art direction, matching the outlined city. */
:root{--ink:#261532;--light:#f8f5ff;--muted:#bfb3d0;--glass:#261532;--line:#ac8dc8;--gold:#ae85f3;--hover:#d2b0ff;--shadow:#180c20;--font:Montserrat,Arial,sans-serif}
button{border:2px solid var(--ink);border-radius:14px;box-shadow:3px 4px 0 var(--ink);color:var(--ink);background:var(--light);font-weight:800}button:hover{background:var(--hover)}button:active{box-shadow:1px 1px 0 var(--ink);transform:translate(2px,3px)}
.brand{font-size:28px;font-weight:900;letter-spacing:-1.4px;transform:rotate(-2deg);text-shadow:2px 2px var(--light)}.brand small{font-weight:700;font-size:12px}
.stats{background:var(--light);border:2px solid var(--ink);color:var(--ink);box-shadow:4px 5px 0 var(--ink);backdrop-filter:none;gap:20px}.stat small{color:var(--muted)}#life{color:var(--ink);font-weight:800}.coin-icon{filter:drop-shadow(1px 1px 0 var(--ink))}
.route{padding:9px 12px;background:var(--light);border:2px solid var(--ink);border-radius:12px;top:104px}.route progress{background:#c7c3b6;height:7px;border:1px solid var(--ink)}progress::-webkit-progress-bar{background:#c7c3b6}progress::-webkit-progress-value{background:var(--gold)}
.modal{background:transparent}.dialog{background:var(--light);color:var(--ink);border:3px solid var(--ink);box-shadow:8px 9px 0 var(--ink);border-radius:28px;backdrop-filter:none;transform:rotate(-1deg)}#caption{color:var(--ink);font-weight:800}.dialog h1{font-size:49px;font-weight:900;letter-spacing:-2px}.dialog p{color:var(--muted)}.rules{border-color:var(--ink);color:var(--muted)}.rules b{color:var(--ink)}#start{border:2px solid var(--ink);box-shadow:4px 5px 0 var(--ink)}.credits{color:var(--muted)}
.help{text-shadow:none;background:var(--light);border:2px solid var(--ink);border-radius:14px;padding:12px 16px;box-shadow:3px 4px 0 var(--ink)}#status,.keys{color:var(--ink)}kbd{color:var(--ink);border:1px solid var(--ink);box-shadow:1px 2px 0 var(--ink)}
.audio-controls{background:var(--light);border:2px solid var(--ink);box-shadow:3px 4px 0 var(--ink)}.audio-controls button{box-shadow:none;color:var(--ink)}.controls button{background:var(--light)}
